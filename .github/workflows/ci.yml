name: Verify and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
  inspection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cmake -S native -B native/build && cmake --build native/build && ctest --test-dir native/build --output-on-failure
      - run: dotnet build api/Inspection.Api.csproj -c Release
      - run: pip install httpx pillow pytest
      - name: Verify the HTTP and native boundary
        run: |
          export LD_LIBRARY_PATH="$PWD/native/build"
          dotnet api/bin/Release/net10.0/Inspection.Api.dll > api-test.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:8001/api/health && break || sleep 1; done
          pytest tests -q
  model-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r ml/requirements.txt
      - run: pytest ml -q
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build

  production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify process lifecycle
        run: python3 -m unittest discover -s deploy -p 'test_*.py' -v
      - name: Build production image
        run: docker build -t portfolio-demo .
      - name: Start production stack
        run: >-
          docker run -d --name portfolio-demo -p 8080:8080
          -e DJANGO_DEBUG=true -e TRUST_LOCAL_PROXY=true -e PUBLIC_SCHEME=http
          -e CSRF_TRUSTED_ORIGINS=http://localhost:8080
          portfolio-demo
      - name: Wait for dependency health
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/healthz; then exit 0; fi
            if [ "$(docker inspect -f '{{.State.Running}}' portfolio-demo)" != "true" ]; then
              docker logs portfolio-demo
              exit 1
            fi
            sleep 2
          done
          docker logs portfolio-demo
          exit 1
      - name: Verify the public request path
        run: python3 deploy/smoke.py http://localhost:8080
      - name: Verify graceful container shutdown
        run: |
          docker stop --time 15 portfolio-demo
          test "$(docker inspect -f '{{.State.ExitCode}}' portfolio-demo)" = "0"
      - name: Container logs
        if: always()
        run: docker logs portfolio-demo

  publish:
    needs: ["frontend", "inspection", "model-contract", "containers", "production"]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: production-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote the verified commit for Railway
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "A newer commit is being verified; leave production unchanged."
            exit 0
          fi
          git push origin HEAD:refs/heads/production
